name: Publish

# Pushing a tag `vX.Y.Z` publishes that version to the fi-workers npm
# registry (Forgejo), and for now also to GitHub Packages.
# Each publish passes --registry explicitly; package.json has no
# publishConfig.registry, so the two targets cannot override each other.
# No artifacts or caches: the package is a handful of config files.
on:
  push:
    tags: ['v*']

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - run: pnpm install --frozen-lockfile
      - run: pnpm verify
      - name: Tag matches package.json version
        run: |
          version="$(node -p 'require("./package.json").version')"
          test "v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME != v$version"; exit 1; }
      - name: Publish to packages.mocco.club
        env:
          FORGEJO_PACKAGES_TOKEN: ${{ secrets.FORGEJO_PACKAGES_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          npmrc="$RUNNER_TEMP/forgejo.npmrc"
          echo "//packages.mocco.club/api/packages/fi-workers/npm/:_authToken=\${FORGEJO_PACKAGES_TOKEN}" > "$npmrc"
          NPM_CONFIG_USERCONFIG="$npmrc" pnpm publish --no-git-checks \
            --registry=https://packages.mocco.club/api/packages/fi-workers/npm/
      # Kept until the GitHub Packages copies see no downloads and are removed.
      # GitHub Packages shares the org's storage quota, so a failure here must
      # not fail the release that already reached packages.mocco.club.
      - name: Publish to GitHub Packages
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          umask 077
          npmrc="$RUNNER_TEMP/github.npmrc"
          echo "//npm.pkg.github.com/:_authToken=\${NODE_AUTH_TOKEN}" > "$npmrc"
          NPM_CONFIG_USERCONFIG="$npmrc" pnpm publish --no-git-checks \
            --registry=https://npm.pkg.github.com
